    problem: Prob015_multi_pipe_8bit
    reason: >-
      Medium sequential design with prior reliable valid-PPA generation and
      a meaningful area/power/timing target.
  - benchmark: RTLLM
    problem: Prob041_traffic_light
    reason: >-
      Smaller sequential/control design that completed quickly while still
