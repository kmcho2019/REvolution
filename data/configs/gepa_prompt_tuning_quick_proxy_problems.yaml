description: >-
  Quick GEPA inner-loop proxy for thought-only prompt tuning. This list is
  intentionally small so GEPA can run more prompt proposals per wall-clock
  hour before final validation returns to the full hard-subset matrix.
recommended_settings:
  population_size: 8
  num_generations: 1
  total_worker_slots: 8
  max_active_problems: 2
  max_workers_per_problem: 4
  qd_grid_quantile_warmup_successes: 8
