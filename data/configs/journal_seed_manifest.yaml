version: 1
manifest_name: journal_revamp_seed_manifest_v1
policy:
  statistical_unit: problem-seed pair
  debug_seed_is_publication_evidence: false
  missing_treatment_rule: counts as treatment loss
debug:
  seeds:
  - 42
  purpose: implementation-readiness debug gate only; never publication evidence
final:
  seeds:
  - 1001
  - 1002
  - 1003
  - 1004
  - 1005
  purpose: 5-seed final publication experiments; freeze configs before use
notes:
- Pre-registered before final experiments per
  docs/journal_features/08_journal_revamp_goal.md. Changing final seeds after
  any final-gate run begins requires an explicit history entry and restarts
  the final evidence collection.
