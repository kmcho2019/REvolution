# Example configuration for an evolutionary run.
# Values here mirror the command line flags exposed by scripts/run_evolution.py.
benchmarks:
  - RTLLM
problems: []
api_backend: openai
vllm_port: 8888
vllm_host: localhost
model_name: gpt-4.1-mini
population_size: 4
num_generations: 3
save_path: ./exp
num_workers: 2
temperature: 0.9
top_p: 0.95
max_tokens: 2048
strategy_selection: epsilon-greedy
epsilon: 0.15
ucb_c: 2.0
generation_mode: whole
population_pool_mode: dual
evaluation_mode: standard
multiprocessing_mode: problem
cvdp_jsonl: data/bench/cvdp/cvdp_v1.0.2_nonagentic_code_generation_no_commercial.jsonl
cvdp_categories:
  - cid002
  - cid003
