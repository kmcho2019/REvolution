version: 1
subset_name: fast_iteration_subset_v1
purpose: "fast classic-vs-journal-variant validation loop; TUNING/DEV artifact only\
  \ \u2014 never publication evidence; the held-out final problem set must exclude\
  \ these problems"
selection:
  source_csv: baselines/hard_iteration_subset_vanilla_openai_gpt_oss_120b.csv
  source_csv_sha256: a9803fc75ac9249c7f9d7e5c6231c30d9083a215194a58cea2410e94dce07fee
  min_functionality: 0.6
  min_gates: 150.0
  max_gates: 3000.0
  per_benchmark_cap: 3
  excluded_hard_subset_problems: 13
  rule: filter by functionality/gate band, exclude hard subset; top gate-count problem
    per (benchmark x circuit_type) bucket, then top up by gate count with per-benchmark
    cap
  subset_size: 6
recommended_budget:
  population_size: 10
  num_generations: 3
  code_samples_per_thought: 4
  max_tokens: 128000
  diff_max_tokens: 128000
  total_worker_slots: 12
  max_active_problems: 6
  max_workers_per_problem: 4
  evaluation_mode: strict_ablation
  notes: ~240 candidate evaluations total (6 problems x (10 init + 3x10 offspring))
    vs ~1560 for the 13-problem 20x5 hard-subset matrix; high functionality keeps
    valid-PPA sample flow high so paired PPA deltas are populated
