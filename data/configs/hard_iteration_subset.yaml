version: 1
subset_name: hard_iteration_subset_v1_pruned
selection:
  subset_size: 13
  per_bucket_target: 4
  primary_functionality_min: 0.1
  primary_functionality_max: 0.6
  fallback_functionality_max: 0.8
  difficulty_formula: log1p(reference_gate_count) * (1 - functionality_rate)
model:
  api_backend: vllm
  model_name: /project/cad-team/LX_Semicon/models/openai-gpt-oss-120b
  vllm_host: host.docker.internal
  vllm_port: 8000
benchmarks:
  RTLLM:
    problems:
    - Prob004_adder_8bit
    - Prob015_multi_pipe_8bit
    - Prob024_fsm
    - Prob037_parallel2serial
    - Prob041_traffic_light
    - Prob045_alu
    - Prob049_signal_generator
  VerilogEval-Spec-to-RTL:
    problems:
    - Prob098_circuit7
    - Prob116_m2014_q3
    - Prob135_m2014_q6b
    - Prob150_review2015_fsmonehot
    - Prob151_review2015_fsm
    - Prob153_gshare
manual_exclusions:
- benchmark: RTLLM
  problem: Prob042_width_8to16
  reason: long or unreliable simulation/ppa behavior for iterative evaluation
- benchmark: VerilogEval-Spec-to-RTL
  problem: Prob124_rule110
  reason: long or unreliable simulation/ppa behavior for iterative evaluation
- benchmark: VerilogEval-Spec-to-RTL
  problem: Prob156_review2015_fancytimer
  reason: long or unreliable simulation/ppa behavior for iterative evaluation
matrix_defaults:
  population_size: 20
  num_generations: 5
  evaluation_mode: search_accelerated
  accelerated_synthesis_top_k: 1
  total_worker_slots: 2
  max_active_problems: 2
  max_workers_per_problem: 2
  temperature: 1.0
  top_p: 1.0
  max_tokens: 128000
  diff_max_tokens: 128000
  qd_num_cells: 16
  qd_cvt_warmup_successes: 4
  seed: 42
modes:
  classic:
    search_mode: revolution
  grid_struct:
    search_mode: revolution_qd
    qd_archive_type: grid
    qd_descriptor_profile: implemented_structural_compact_3d
  cvt_struct:
    search_mode: revolution_qd
    qd_archive_type: cvt
    qd_descriptor_profile: implemented_structural_fixed_5d
  cvt_size_control:
    search_mode: revolution_qd
    qd_archive_type: cvt
    qd_descriptor_profile: size_control_3d
