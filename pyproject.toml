[project.optional-dependencies]
dev = ["pytest", "pytest-mock", "pytest-asyncio"]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-mock>=3.14.1",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto" # Add this for pytest-asyncio

[tool.setuptools.packages.find]
where = ["src"]
include = ["revolution*"]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

# Version of cocotb found to be used in docker imageghcr.io/hdl/sim/osvb:latest, which is used in CVDP
[tool.uv.sources]
cocotb = { git = "https://github.com/cocotb/cocotb", rev = "8d6c1a63a39aa9f204acdf9bf429e7ec93b02ab2" }
