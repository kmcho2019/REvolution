experiment_id: REQUIRED
candidate_id: REQUIRED
candidate_class: REQUIRED  # CORE_CORRECTION | HARDWARE_EXTENSION | AUGMENTATION
stage: REQUIRED  # smoke | representative_probe | full_suite_probe | confirmation | holdout

code:
  baseline_commit: REQUIRED
  candidate_commit: REQUIRED
  classic_core_sha256: REQUIRED
  dirty_tree: false
  candidate_mode: REQUIRED
  config_sha256: REQUIRED
  report_code_sha256: REQUIRED

program_budget:
  contract_path: REQUIRED
  contract_sha256: REQUIRED
  wave_id: REQUIRED
  frozen_worksheet_path: REQUIRED
  frozen_worksheet_sha256: REQUIRED
  program_ledger_path: REQUIRED
  initial_program_ledger_sha256: REQUIRED
  accounting_artifact_path: REQUIRED
  accounting_evidence_path: REQUIRED
  accounting_evidence_sha256: REQUIRED
  token_and_synthesis_enforcement: sealed_post_arm_stop_gate
  all_control_arms_included: true

prompts:
  baseline_sha256: REQUIRED
  candidate_sha256: REQUIRED
  isolated_delta: REQUIRED
  baseline_operator_family: eoh_operators
  candidate_operator_family: REQUIRED  # eoh_operators unless operator family is treatment

model:
  provider: REQUIRED
  model: REQUIRED
  temperature: REQUIRED
  top_p: REQUIRED
  max_tokens: REQUIRED
  diff_max_tokens: REQUIRED

budget:
  generations: REQUIRED
  population_size: REQUIRED
  candidate_evaluations_per_problem: REQUIRED
  max_llm_calls_per_problem: REQUIRED
  max_total_tokens_per_problem: REQUIRED
  max_synthesis_calls_per_problem: REQUIRED

benchmarks:
  role: REQUIRED  # smoke | representative | full_suite | confirmation | holdout
  source: REQUIRED
  manifest_path: REQUIRED
  manifest_sha256: REQUIRED
  baseline_only_selection_rule_sha256: REQUIRED
  reference_complete_only: REQUIRED  # false for functionality-only CVDP
  candidate_missing_policy: count_as_method_failure
  excluded_units_path: REQUIRED
  prior_exposure: REQUIRED
  eligibility_audit_path: REQUIRED
  eligibility_audit_sha256: REQUIRED

seeds:
  manifest_path: REQUIRED
  manifest_sha256: REQUIRED
  values: [REQUIRED]
  role: REQUIRED  # smoke | development | confirmation | holdout
  disjoint_role_manifest_sha256: REQUIRED

toolchain:
  simulator: REQUIRED
  synthesizer: REQUIRED
  ppa_flow: REQUIRED
  container_or_environment_sha256: REQUIRED

primary_metrics: [REQUIRED]  # explicit metrics for the selected stage

secondary_metrics:
  - hypervolume_auc
  - best_normalized_ppa
  - reference_beating_count
  - valid_ppa_sample_yield
  - llm_calls_to_first_improvement
  - total_llm_tokens
  - total_synthesis_evaluations

mechanism_metrics: [REQUIRED]

statistics:
  unit: problem_seed_pair
  cluster: problem
  interval_method: seeded_problem_cluster_bootstrap
  bootstrap_replicates: REQUIRED
  bootstrap_seed: REQUIRED
  missing_treatment_policy: penalized_method_failure
  tie_tolerance: REQUIRED
  ppa_metric_floor_policy: REQUIRED
  hypervolume_floor: 0.0
  functionality_floor: 0.0
  practical_margins_path: REQUIRED
  practical_margins_sha256: REQUIRED

frozen_gates:
  benefit:
    endpoint: REQUIRED
    scope: per_seed
    minimum_delta_exclusive: 0.0
    combine_seeds: all
  final_hv46:
    scope: pooled_problem_seed
    minimum_mean_delta: -0.0050
  hv_auc46:
    scope: pooled_problem_seed
    minimum_mean_delta: -0.0036
  coverage:
    valid_ppa46:
      scope: per_seed
      maximum_deficit_each_seed: 1
      combine_seeds: all
    rtl_functionality46:
      scope: per_seed
      maximum_deficit_each_seed: 1
      combine_seeds: all
    rtl_functionality50:
      scope: per_seed
      maximum_deficit_each_seed: 1
      combine_seeds: all
  require_exact_candidate_budget: true
  maximum_auxiliary_resource_relative_skew: 0.10
  catastrophic_stop:
    scope: aggregate_two_seed_development
    minimum_mean_hv_ratio: 0.90
    coverage_reduction: sum_per_seed_loss_only
    maximum_valid_ppa46_loss: 3
    maximum_rtl_functionality46_loss: 3
    maximum_rtl_functionality50_loss: 3
  paper_candidate: REQUIRED
  retirement: REQUIRED

reviews:
  hypothesis_review_path: REQUIRED
  code_review_path: REQUIRED
  evidence_review_path: REQUIRED
  contract_translation_test_path: REQUIRED
  contract_translation_test_sha256: REQUIRED

artifacts:
  raw_root: REQUIRED
  report_command: REQUIRED
  report_root: REQUIRED
  decision_path: REQUIRED
