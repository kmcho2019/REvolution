version: 1
lock_name: auto_bd_run_policy_lock_v1
status: initial_lock_before_auto_bd_method_comparison
source_of_truth:
  plan: docs/journal_features/revamp_history/20260618_232234_KST_auto_bd_research/auto_bd_research_plan.md
  subset_lock: docs/journal_features/revamp_history/20260618_232234_KST_auto_bd_research/auto_bd_subset_lock.yaml
  task_catalog: docs/journal_features/revamp_history/20260618_232234_KST_auto_bd_research/auto_bd_task_catalog.json
  seed_manifest: data/configs/journal_seed_manifest.yaml
  descriptor_profiles: data/configs/qd_descriptor_profiles.yaml
  baseline_guides:
  - docs/qd_map_elites_guide.md
  - docs/journal_features/16_smooth_qd_integration_track.md

model_policy:
  endpoint: http://20.0.0.103:8000/v1
  model_id: openai/gpt-oss-120b
  observed_max_model_len: 131072
  required_min_model_len: 131072
  max_tokens: 128000
  diff_max_tokens: 128000
  tiny_smoke_exception: true
  asymmetric_model_fallback_allowed: false
  preflight_command: curl -sS --max-time 10 http://20.0.0.103:8000/v1/models

seed_policy:
  statistical_unit: problem_seed_pair
  missing_treatment_rule: counts_as_treatment_loss
  debug:
  - 42
  preliminary_seed1:
  - 1001
  screening_seed3:
  - 1001
  - 1002
  - 1003
  final_seed5:
  - 1001
  - 1002
  - 1003
  - 1004
  - 1005
  heldout_minimum:
  - 1001
  - 1002
  - 1003
  heldout_preferred:
  - 1001
  - 1002
  - 1003
  - 1004
  - 1005

phase_policy:
  development:
    subset_role: development
    seeds: preliminary_seed1
    promoted_method_seeds: screening_seed3
    population_size: 12
    num_generations: 3
    evaluation_mode: strict_ablation
  main_screening:
    subset_role: main_screening
    seeds: screening_seed3
    population_size: 20
    num_generations: 5
    evaluation_mode: search_accelerated
    accelerated_synthesis_top_k: 1
  final_main:
    subset_role: main_screening
    seeds: final_seed5
    population_size: 20
    num_generations: 5
    evaluation_mode: search_accelerated
    accelerated_synthesis_top_k: 1
  heldout_validation:
    subset_role: heldout_validation
    seeds: heldout_minimum
    preferred_seeds: heldout_preferred
    population_size: 20
    num_generations: 5
    evaluation_mode: search_accelerated
    accelerated_synthesis_top_k: 1
    tuning_allowed: false

timeout_policy:
  source: locked_from_scripts_run_backend_defaults_before_method_runs
  rtl_simulation_timeout_s: 60
  synthesis_timeout_s: 300
  post_synthesis_simulation_timeout_s: 300
  cvdp_simulation_timeout_s: 120

worker_policy:
  rule: use_the_same_worker_policy_for_every_compared_method_in_a_phase
  development:
    total_worker_slots: 12
    max_active_problems: 6
    max_workers_per_problem: 4
  main_screening:
    total_worker_slots: 13
    max_active_problems: 13
    max_workers_per_problem: 4
  final_main:
    total_worker_slots: 13
    max_active_problems: 13
    max_workers_per_problem: 4
  ppa_remeasurement:
    total_worker_slots: 4
    max_active_problems: 4
    max_workers_per_problem: 4
  change_rule: reduce_or_increase_only_symmetrically_across_all_arms_and_log_reason

budget_policy:
  budget_axis: candidate_evaluations_and_llm_calls
  main_reported_total_budget_per_problem: 240
  auxiliary_compute_skew_threshold: 0.10
  hidden_extra_repair_budget_allowed: false
  report_valid_only_and_all_candidate_metrics: true

prompt_policy:
  hash_paths:
  - data/prompts
  - src/revolution/llm.py
  - src/revolution/backends/eoh_backend.py
  - src/revolution/backends/revolution_backend.py
  - src/revolution/qd/engine.py

baseline_arms:
  classic_revolution:
    backend: revolution
    search_mode: revolution
    representation_kind: code_individual
    operator_kind: eoh_strategies
    archive_type: none
    role: gate_0_coverage_reference
  landing_smooth_qd_manual_bd:
    backend: revolution
    search_mode: revolution_qd
    mode_name: grid_quantile_pareto_journal_bd_eoh
    representation_kind: code_individual
    qd_operator_kind: eoh_strategies
    qd_archive_type: grid_quantile
    qd_descriptor_profile: journal_logic_ff_width_3d
    qd_descriptor_axes:
    - logic_depth
    - ff_depth
    - comb_width_log
    qd_grid_quantile_warmup_successes: 8
    qd_cell_mode: pareto_front
    qd_max_elites_per_cell: 5
    qd_objectives: ppa
    qd_champion_lane_fraction: 0.5
    qd_parent_selection: nsga2_global_rank
    qd_two_parent_probability: 0.5
    role: manual_bd_baseline_not_failed_original_v2

control_arms:
  random_descriptor_qd:
    descriptor_rule: hash_canonical_netlist_hash_with_fixed_seed_to_cell
    random_seed: 20260618
    archive_cell_count_rule: match_landing_smooth_qd_manual_bd
    insertion_policy_rule: match_landing_smooth_qd_manual_bd
  simple_yosys_stat_bd:
    descriptor_source: yosys_json_or_synthesis_stats
    allowed_feature_families:
    - total_cells
    - sequential_cells
    - mux_cells
    - arithmetic_cells
    - fanout_statistics
    - level_histograms
    reject_if_equivalent_to_manual_trio_or_final_fitness: true

candidate_method_arms:
  netlist_motif_occupancy:
    descriptor_source: synthesized_netlist_cell_motifs
    descriptor_profile: netlist_motif_occupancy_4d
    allowed_feature_families:
    - logic_gate_occupancy
    - mux_control_occupancy
    - arithmetic_occupancy
    - cell_type_entropy
    reject_if_equivalent_to_yosys_stat_control: true
  synthesis_trajectory_nod:
    descriptor_source: yosys_stage_dumps
    descriptor_profile: stnod_trajectory_5d
    allowed_feature_families:
    - cell_count_growth
    - logic_gate_trajectory_swing
    - mux_control_trajectory_swing
    - arithmetic_trajectory_swing
    - cell_type_entropy_trajectory_swing
    observational_equivalence_required: true
    reject_if_equivalent_to_final_motif_or_yosys_stat_control: true
  synthesis_trajectory_motif_nod:
    descriptor_source: synthesized_netlist_and_yosys_stage_dumps
    descriptor_profile: stnod_motif_trajectory_9d
    role: ablation_for_motif_only_vs_trajectory_motif
    allowed_feature_families:
    - logic_gate_occupancy
    - mux_control_occupancy
    - arithmetic_occupancy
    - cell_type_entropy
    - cell_count_growth
    - logic_gate_trajectory_swing
    - mux_control_trajectory_swing
    - arithmetic_trajectory_swing
    - cell_type_entropy_trajectory_swing
    observational_equivalence_required: true
    reject_if_equivalent_to_motif_only_or_trajectory_only: true
  sr_raw_pca_qd:
    descriptor_source: frozen_synthesis_response_pca_artifact
    descriptor_profile: sr_pca_3d
    role: first_projected_synthesis_response_baseline
    allowed_feature_families:
    - final_yosys_stats
    - final_motif_occupancy
    - stnod_trajectory_swings
    fitting_protocol: fixed_offline
    fitting_artifact: docs/journal_features/revamp_history/20260618_232234_KST_auto_bd_research/auto_bd_methods/04_synthesis_response_kernel_pca/fitting_artifacts/sr_raw_pca_dev_seed1001/sr_raw_pca_artifact.json
    forbidden_inputs:
    - ppa
    - fitness
    - hypervolume
    - reference_ppa
    - testbench_pass_percentage
    - problem_id
    reject_if_fit_on_evaluation_candidates: true
  sr_random_relu_pca_qd:
    descriptor_source: frozen_synthesis_response_random_relu_pca_artifact
    descriptor_profile: sr_pca_3d
    role: main_random_kernel_pca_candidate_after_raw_baseline
    allowed_feature_families:
    - final_yosys_stats
    - final_motif_occupancy
    - stnod_trajectory_swings
    - per_stage_motif_ratios
    - per_stage_cell_count_deltas
    random_feature_map: relu
    random_feature_count: 128
    random_feature_seed: 20260618
    fitting_protocol: fixed_offline
    fitting_artifact: docs/journal_features/revamp_history/20260618_232234_KST_auto_bd_research/auto_bd_methods/04_synthesis_response_kernel_pca/fitting_artifacts/sr_random_relu_pca_dev_seed1001/sr_random_relu_pca_artifact.json
    forbidden_inputs:
    - ppa
    - fitness
    - hypervolume
    - reference_ppa
    - testbench_pass_percentage
    - problem_id
    reject_if_fit_on_evaluation_candidates: true
  sr_rff_pca_qd:
    descriptor_source: frozen_synthesis_response_rff_pca_artifact
    descriptor_profile: sr_pca_3d
    role: random_fourier_feature_kernel_control_after_relu
    allowed_feature_families:
    - final_yosys_stats
    - final_motif_occupancy
    - stnod_trajectory_swings
    - per_stage_motif_ratios
    - per_stage_cell_count_deltas
    random_feature_map: rff
    random_feature_count: 128
    random_feature_seed: 20260618
    fitting_protocol: fixed_offline
    fitting_artifact: docs/journal_features/revamp_history/20260618_232234_KST_auto_bd_research/auto_bd_methods/04_synthesis_response_kernel_pca/fitting_artifacts/sr_rff_pca_dev_seed1001/sr_rff_pca_artifact.json
    forbidden_inputs:
    - ppa
    - fitness
    - hypervolume
    - reference_ppa
    - testbench_pass_percentage
    - problem_id
    reject_if_fit_on_evaluation_candidates: true
  sr_vq_codebook_qd:
    descriptor_source: frozen_synthesis_response_vq_codebook_artifact
    descriptor_profile: sr_vq_3d
    role: vq_elites_style_codebook_after_projected_methods
    allowed_feature_families:
    - final_yosys_stats
    - final_motif_occupancy
    - stnod_trajectory_swings
    - per_stage_motif_ratios
    - per_stage_cell_count_deltas
    codebook_size: 16
    codebook_layout: centroid_pca_3d
    kmeans_seed: 20260618
    fitting_protocol: fixed_offline
    fitting_artifact: docs/journal_features/revamp_history/20260618_232234_KST_auto_bd_research/auto_bd_methods/07_vq_implementation_codebook/fitting_artifacts/sr_vq_codebook_dev_seed1001/sr_vq_codebook_artifact.json
    forbidden_inputs:
    - ppa
    - fitness
    - hypervolume
    - reference_ppa
    - testbench_pass_percentage
    - problem_id
    reject_if_fit_on_evaluation_candidates: true
    require_codebook_region_labels: true

common_audit_space:
  required: true
  audit_spaces:
  - manual_bd_trio_fixed_quantile_grid
  - fixed_yosys_stat_grid
  - fixed_motif_histogram_projection_or_cvt
  fit_data_rule: development_and_baseline_data_only_before_main_comparison
  report_internal_and_common_audit_qd_metrics: true

descriptor_leakage_policy:
  ppa_inputs_allowed: false
  reference_ppa_inputs_allowed: false
  fitness_inputs_allowed: false
  heldout_fitting_allowed: false
  posthoc_full_run_embedding_claimed_as_in_loop_allowed: false
  descriptor_version_logged_per_candidate: true

ppa_metric_policy:
  objective_directions:
    area: minimize
    power: minimize
    timing_or_effective_period: minimize
  combinational_timing_weight: 0
  sequential_metric_count: 3
  combinational_metric_count: 2
  hypervolume_reference_points_fixed_before_comparison: true
  invalid_candidates_in_denominator_sensitive_metrics: true
  ppa_remeasurement_required_for_final_elites: true

toolchain_policy:
  freeze_before_publication_claim: true
  liberty_file: pdk/Nangate45/Nangate45_typ.lib
  pdk_or_tech_config_path: pdk/Nangate45
  constraint_hash_paths:
  - scripts/ref/ref.yosys.tcl
  - scripts/ref/ref.abc.script
  - scripts/ref/ref.openroad.tcl
  - src/revolution/evaluation.py
  required_run_manifest_fields:
  - git_commit
  - branch
  - config_hash
  - subset_hash
  - seed_list
  - model_id
  - endpoint
  - prompt_policy_hash
  - yosys_version
  - abc_version
  - openroad_version
  - liberty_file_hash
  - pdk_or_tech_config_hash
  - constraints_hash
  - timeout_policy
  - budget_policy
  - worker_count
  - thread_policy
