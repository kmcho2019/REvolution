method_family: yosys_stat_bd
method_name: yosys_stat_compact_3d_grid_quantile_control
status: implemented_not_run

descriptor:
  profile: yosys_stat_compact_3d
  descriptor_file: descriptor_profile.yaml
  axes:
  - cell_count_log
  - seq_ratio
  - mux_ratio
  source: synthesized_netlist_structural_metrics
  fitting_protocol: none
  secondary_ablation_profile: yosys_stat_mix_4d
  forbidden_inputs:
  - ppa
  - reference_ppa
  - fitness
  - hypervolume

qd:
  archive_type: grid_quantile
  descriptor_file: descriptor_profile.yaml
  cell_mode: pareto_front
  objectives: ppa
  grid_quantile_warmup_successes: 8
  max_elites_per_cell: 5
  parent_selection: nsga2_global_rank
  champion_lane_fraction: 0.5
  operator_kind: eoh_strategies

comparison_policy:
  baseline_lock: ../../auto_bd_run_policy_lock.yaml
  same_subsets_seeds_model_budget_as_baseline: true
  report_internal_and_common_audit_space: true
