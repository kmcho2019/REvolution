profiles:
  yosys_stat_compact_3d:
  - cell_count_log
  - seq_ratio
  - mux_ratio
  yosys_stat_mix_4d:
  - cell_count_log
  - seq_ratio
  - mux_ratio
  - adder_ratio

grid_axes:
  cell_count_log:
    bins: 4
    lower_bound: 0.0
    upper_bound: 16.0
  seq_ratio:
    bins: 4
    lower_bound: 0.0
    upper_bound: 1.0
  mux_ratio:
    bins: 4
    lower_bound: 0.0
    upper_bound: 1.0
  adder_ratio:
    bins: 4
    lower_bound: 0.0
    upper_bound: 1.0
